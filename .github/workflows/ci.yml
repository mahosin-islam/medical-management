name: Medical Management CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build scripts approve
      run: |
        pnpm rebuild sharp
        pnpm rebuild unrs-resolver

    - name: Run Linter
      run: pnpm run lint

    - name: Build Next.js application
      run: pnpm run build
      env:
        BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
        MONGODB_URL: ${{ secrets.MONGODB_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

        # === এই নিচের অংশটুকু যুক্ত করতে হবে Vercel-এ পাঠানোর জন্য ===
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }} # GitHub Settings-এ এই সিক্রেটগুলোও লাগবে
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'