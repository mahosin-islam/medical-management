# ১. পাইপলাইনের নাম
name: Medical Management CI Pipeline

# ২. পাইপলাইন কখন রান করবে (main ব্রাঞ্চে পুশ বা পুল রিকোয়েস্ট হলে)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # ৩. গিটহাবের ভার্চুয়াল কম্পিউটারে কোড নিয়ে আসা
    - name: Checkout repository
      uses: actions/checkout@v4

    # ৪. pnpm সেটআপ করা এবং এটিকে বলে দেওয়া যে মূল কোড my-app ফোল্ডারে আছে
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
        # এই অংশটুকু pnpm-কে সরাসরি আপনার my-app ফোল্ডারে নিয়ে যাবে
        run_install: |
          - recursive: false
            cwd: ./my-app

    # ৫. Node.js সেটআপ এবং pnpm ক্যাশ চালু করা
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        # ক্যাশ ফাইলগুলো খোঁজার জন্য pnpm-কে পাথ বলে দেওয়া হলো
        cache-dependency-path: ./my-app/pnpm-lock.yaml

    # ৬. ডিপেন্ডেন্সি ইনস্টল করা (my-app ফোল্ডারের ভেতর)
    - name: Install dependencies
      working-directory: ./my-app
      run: pnpm install --frozen-lockfile

    # ৭. কোডের ভুল বা ফরম্যাটিং চেক করা (my-app ফোল্ডারের ভেতর)
    - name: Run Linter
      working-directory: ./my-app
      run: pnpm run lint

    # ৮. নেক্সট জেএস প্রজেক্ট প্রোডাকশনের জন্য বিল্ড করা (ভেঙে যাওয়া লাইনটি সোজা করা হয়েছে)
    - name: Build Next.js application
      working-directory: ./my-app
      run: pnpm run build