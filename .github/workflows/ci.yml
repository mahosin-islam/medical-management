name: Medical Management CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # ১. GitHub থেকে কোড নিয়ে আসা
    - name: Checkout repository
      uses: actions/checkout@v4

    # ২. সরাসরি Node.js সেটআপ করা (ক্যাশ ছাড়া, যাতে প্রথমবার ফ্রেশ ইনস্টল হয়)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # ৩. গ্লোবালি pnpm ইনস্টল করা (এটি কোনো এরর ছাড়াই ১০০% কাজ করবে)
    - name: Install pnpm
      run: npm install -g pnpm

    # ৪. ডিপেন্ডেন্সি ইনস্টল করা (my-app ফোল্ডারের ভেতর)
    - name: Install dependencies
      working-directory: ./my-app
      run: pnpm install --frozen-lockfile

    # ৫. কোডের ভুল বা ফরম্যাটিং চেক করা (my-app ফোল্ডারের ভেতর)
    - name: Run Linter
      working-directory: ./my-app
      run: pnpm run lint

    # ৬. নেক্সট জেএস প্রজেক্ট প্রোডাকশনের জন্য বিল্ড করা
    - name: Build Next.js application
      working-directory: ./my-app
      run: pnpm run build